<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante Viva</title>
    <link rel="stylesheet" href="Geral.css">
</head>

<body>
    <header>
        <nav>
            <h1>Estante Viva</h1>
            <div>
                <a href="#Catalogo">Catálogo</a>
                <hr class="LinhaMeio">
                <a href="#Cadastro">Cadastro</a>
            </div>
        </nav>
    </header>
    <main>
        <section id="Cadastro" class="Cadastro">
            <h1>Gerenciamento de livros</h1>
            <form action="">
                <div>
                    <label for="">Título *<input type="text" placeholder="Infome o Título"></label>
                </div>
                <div>
                    <label for="">Autor *<input type="text" placeholder="Informe o autor"></label>
                </div>
                <div>
                    <label for="">Preço (R$) *<input type="text" placeholder="0.00"></label>
                    <label for="">Quantidade em estoque * *<input type="text" placeholder="0"></label>
                    <button type="submit">Cadastrar Livro</button>
                </div>
                <p>Area para mensagens de sucesso ou erro</p>
            </form>
        </section>
        <section id="Catalogo" class="Catalogo">
            <form action=""><input type="text" placeholder="Busca por parte do Título"></form>
        </section>
    </main>
    <script src="Script.js"></script>
</body>

</html>
